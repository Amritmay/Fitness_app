<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ascend</title>
  <meta name="description" content="Calisthenics skill trees, daily plans and progress tracking.">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-title" content="Ascend">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="rest-pill" class="rest-pill" aria-live="polite"></div>
  <div id="app"></div>
  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="sheet" class="sheet"></div>
  <div id="stopwatch" class="stopwatch"></div>
  <div id="celebrate" class="celebrate" role="dialog" aria-modal="true" aria-label="Celebration"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Ascend needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
